{% load static %}

<div class="cart-row">
<div style="flex:2"><img class="row-image" src="{{  item.product.get_first_photo }}" width="100px;"></div>
    <div style="flex:2"><p>{{ item.product.title }}</p></div>
    <div style="flex:1"><p>${{ item.product.price }}</p></div>
    <div style="flex:1"><p class="quantity">{{ item.quantity }}</p></div>


    <div class="quantity">
            {% if item.product.quantity > 0 %}
            <a href="{% url 'to_cart' item.product.pk 'add' %}">
                <img data-product="id" data-actions="add"
                     class="chg-quantity update-cart"
                     src="{% static 'store/images/arrow-up.png' %}" width="50px;">
            </a>
            {% endif %}
            <a href="{% url 'to_cart' item.product.pk 'delete' %}">
                <img data-product="id" data-actions="remove"
                     class="chg-quantity update-cart"
                     src="{% static 'store/images/arrow-down.png' %}" width="50px;">
            </a>
        </div>


    <div style="flex:1">${{ item.get_total_price }}</div>
</div>
